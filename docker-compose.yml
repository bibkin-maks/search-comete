services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: search-comete-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.license.self_generated.type=trial
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - search-comete-network

  backend:
    build: ./backend
    container_name: search-comete-backend
    ports:
      - "8000:8000"
    environment:
      - ES_HOST=http://elasticsearch:9200
      - ELASTIC_CLIENT_APIVERSION=8
    depends_on:
      - elasticsearch
    networks:
      - search-comete-network

volumes:
  elasticsearch-data:

networks:
  search-comete-network:
    driver: bridge